<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in - Grade Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header" id="site-header"></header>
  <div id="message"></div>

  <main class="inner">
    <section class="card auth-card">
      <h2>Log in</h2>
      <p class="muted">Log in to see your courses and grades.</p>

      <form class="stack" onsubmit="handleLogin(event)" novalidate>
        <label>Username <input name="username" autocomplete="username"></label>
        <label>Password <input name="password" type="password" autocomplete="current-password"></label>
        <button type="submit">Log in</button>
      </form>

      <p class="muted">New here? <a href="register.html">Create an account</a></p>
    </section>
  </main>

  <footer class="inner site-footer" id="site-footer"></footer>

  <script src="js/ui.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
