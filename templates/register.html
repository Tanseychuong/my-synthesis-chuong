<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - Grade Tracker</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <header class="site-header" id="site-header"></header>
  <div id="message"></div>

  <main class="inner">
    <section class="card auth-card">
      <h2>Create an account</h2>
      <p class="muted">An account keeps your courses and grades saved, so you do not have to enter them again.
        It is stored in this browser only, and there is no way to reset a forgotten password. Do not use a password you use anywhere else.</p>

      <form class="stack" onsubmit="handleRegister(event)" novalidate>
        <label>Username <input name="username" autocomplete="username" placeholder="3 to 30 letters or numbers"></label>
        <label>Password <input name="password" type="password" autocomplete="new-password"
            placeholder="At least 6 characters"></label>
        <label>Confirm password <input name="confirm" type="password" autocomplete="new-password"></label>
        <button type="submit">Create account</button>
      </form>

      <p class="muted">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <footer class="inner site-footer" id="site-footer"></footer>

  <script src="../servers/ui.js"></script>
  <script src="../servers/storage.js"></script>
  <script src="../servers/auth.js"></script>
  <script src="../servers/register.js"></script>
</body>

</html>
