<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Grade Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <!-- Success and error messages appear here -->
  <div id="message"></div>

  <!-- The page's script draws the content inside this element -->
  <main class="inner" id="app"></main>

  <footer class="inner site-footer" id="site-footer"></footer>

  <!-- Order matters: shared files first, then this page's own file -->
  <script src="js/ui.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/calculations.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
